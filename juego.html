<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Papa Louie - Tarixa</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        ruffle-player {
            display: block;

            width: 100%;
            height: 100%;
        }

        /* Panel temporal para diagnosticar el teclado */
        #key-debug {
            position: fixed;

            top: 10px;
            left: 10px;

            z-index: 999999;

            min-width: 180px;

            padding: 10px 14px;

            background: rgba(0, 0, 0, 0.85);
            color: white;

            border: 1px solid white;
            border-radius: 8px;

            font-family: monospace;
            font-size: 16px;
            line-height: 1.4;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- JUEGO -->
    <div id="game-container"></div>

    <!-- DIAGNÓSTICO TEMPORAL -->
    <div id="key-debug">
        Teclas presionadas:<br>
        Ninguna
    </div>

    <script>

        /*
         * RUFFLE
         */

        const ruffle =
            window.RufflePlayer.newest();

        const player =
            ruffle.createPlayer();

        player.tabIndex = 0;

        document
            .getElementById("game-container")
            .appendChild(player);

        player.load(
            "games/papa-louie/papalouie_v2.swf"
        );


        /*
         * FOCO DEL JUEGO
         */

        player.addEventListener(
            "click",
            () => {
                player.focus();
            }
        );

        player.addEventListener(
            "touchstart",
            () => {
                player.focus();
            }
        );


        /*
         * DIAGNÓSTICO DE TECLADO
         */

      
            const pressedKeys = new Set();

            const keyDebug =
            document.getElementById("key-debug");

    function updateKeyDebug() {

    if (pressedKeys.size === 0) {
        keyDebug.innerHTML =
            "Teclas Tarixa:<br>Ninguna";
        return;
    }

    keyDebug.innerHTML =
        "Teclas Tarixa:<br>" +
        Array
            .from(pressedKeys)
            .join("<br>");
}

window.tarixaKeyDown =
    function (key) {

        pressedKeys.add(key);
        updateKeyDebug();
    };

window.tarixaKeyUp =
    function (key) {

        pressedKeys.delete(key);
        updateKeyDebug();
    };

updateKeyDebug();


        /*
         * PÉRDIDA DE FOCO
         */

        window.addEventListener(
            "blur",
            () => {

                pressedKeys.clear();

                updateKeyDebug();

                console.log(
                    "WINDOW BLUR - teclas limpiadas"
                );
            }
        );


        /*
         * ESTADO INICIAL
         */

        updateKeyDebug();

    </script>

</body>

</html>
