<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Tarixa Player</title>

    <link
        rel="stylesheet"
        href="styles/juego.css"
    >

    <!-- Ruffle -->
    <script
        src="https://unpkg.com/@ruffle-rs/ruffle@0.5.0">
    </script>

</head>


<body>

    <!-- TOP BAR -->

    <header id="game-header">

        <a
            href="index.html"
            class="volver"
        >
            ← Tarixa
        </a>

        <span id="game-title">
            Tarixa Player
        </span>

        <button
            id="fullscreen-button"
            type="button"
            aria-label="Fullscreen"
            title="Fullscreen"
        >
            ⛶
        </button>

    </header>


    <!-- GAME -->

    <main id="game-container"></main>


    <script>

        const games = {

            "papa-louie": {
                title: "Papa Louie",
                swf: "games/papalouie_v2.swf"
            },

            "stick-war":{
                title: "Stick War",
                swf: "games/Stick War.swf"
            } 
        };



        const params =
            new URLSearchParams(
                window.location.search
            );

        const gameId =
            params.get("game");

        const game =
            games[gameId];




        if (!game) {

            document.body.innerHTML = `

                <div class="game-error">

                    <h1>Game not found</h1>

                    <p>
                        This game doesn't exist
                        or is no longer available.
                    </p>

                    <a href="index.html">
                        Back to Tarixa
                    </a>

                </div>

            `;

            throw new Error(
                "Game not found: " + gameId
            );

        }


  
    
        document.title =
            game.title + " - Tarixa";

        document
            .getElementById("game-title")
            .textContent =
                game.title;


        /*
         * ==========================================
         * RUFFLE
         * ==========================================
         */

        const ruffle =
            window.RufflePlayer.newest();

        const player =
            ruffle.createPlayer();

        player.tabIndex = 0;


        document
            .getElementById("game-container")
            .appendChild(player);


        player.load({

            url: game.swf,

            autoplay: "on",

            unmuteOverlay: "hidden",

            letterbox: "on"

        });


        /*
         * ==========================================
         * PLAYER FOCUS
         * ==========================================
         */

        function focusPlayer() {

            try {

                player.focus();

            }
            catch (error) {

                console.log(
                    "Unable to focus Ruffle",
                    error
                );

            }

        }


        player.addEventListener(
            "pointerdown",
            focusPlayer
        );


    

        const fullscreenButton =
            document.getElementById(
                "fullscreen-button"
            );


        fullscreenButton.addEventListener(
            "click",
            async () => {

                try {

                    if (!document.fullscreenElement) {

                        await document
                            .documentElement
                            .requestFullscreen();

                    }
                    else {

                        await document
                            .exitFullscreen();

                    }

                    focusPlayer();

                }
                catch (error) {

                    console.log(
                        "Fullscreen is not available",
                        error
                    );

                }

            }
        );


 
        const pressedKeys =
            new Set();


        window.tarixaKeyDown =
            function (key) {

                pressedKeys.add(key);

        };


        window.tarixaKeyUp =
            function (key) {

                pressedKeys.delete(key);


                if (pressedKeys.size === 0) {

                    try {

                        player.blur();

                    }
                    catch (error) {

                        console.log(
                            "Blur unavailable",
                            error
                        );

                    }


                    setTimeout(
                        focusPlayer,
                        30
                    );

                }

        };


        /*
         * ==========================================
         * WINDOW FOCUS
         * ==========================================
         */

        window.addEventListener(
            "blur",
            () => {

                pressedKeys.clear();

            }
        );

    </script>

</body>

</html>
