<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Papa Louie - Tarixa</title>

    <!-- Ruffle con versión fija -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle@0.6.0"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        ruffle-player {
            display: block;

            width: 100%;
            height: 100%;
        }

        #key-debug {
            position: fixed;

            top: 10px;
            left: 10px;

            z-index: 999999;

            min-width: 180px;

            padding: 10px 14px;

            background: rgba(0, 0, 0, 0.85);
            color: white;

            border: 1px solid white;
            border-radius: 8px;

            font-family: monospace;
            font-size: 16px;
            line-height: 1.4;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="game-container"></div>

    <div id="key-debug">
        Teclas Tarixa:<br>
        Ninguna
    </div>

    <script>

        /*
         * RUFFLE
         */

        const ruffle =
            window.RufflePlayer.newest();

        const player =
            ruffle.createPlayer();

        player.tabIndex = 0;

        document
            .getElementById("game-container")
            .appendChild(player);

        player.load(
            "games/papa-louie/papalouie_v2.swf"
        );


        /*
         * FOCO
         */

        function focusPlayer() {

            try {
                player.focus();
            }
            catch (error) {
                console.log(
                    "No se pudo dar foco a Ruffle",
                    error
                );
            }
        }

        player.addEventListener(
            "click",
            focusPlayer
        );

        player.addEventListener(
            "touchstart",
            focusPlayer
        );


        /*
         * ESTADO DE TECLAS ENVIADO POR TARIXA
         */

        const pressedKeys =
            new Set();

        const keyDebug =
            document.getElementById(
                "key-debug"
            );


        function updateKeyDebug() {

            if (pressedKeys.size === 0) {

                keyDebug.innerHTML =
                    "Teclas Tarixa:<br>Ninguna";

                return;
            }

            keyDebug.innerHTML =
                "Teclas Tarixa:<br>" +
                Array
                    .from(pressedKeys)
                    .join("<br>");
        }


        /*
         * TARIXA KEY DOWN
         */

        window.tarixaKeyDown =
            function (key) {

                pressedKeys.add(key);

                updateKeyDebug();
            };


        /*
         * TARIXA KEY UP
         */

        window.tarixaKeyUp =
            function (key) {

                pressedKeys.delete(key);

                updateKeyDebug();

                /*
                 * Workaround:
                 * cuando ya no queda ninguna tecla,
                 * forzamos una pérdida y recuperación
                 * rápida del foco.
                 */

                if (pressedKeys.size === 0) {

                    try {
                        player.blur();
                    }
                    catch (error) {
                        console.log(
                            "Blur no disponible",
                            error
                        );
                    }

                    setTimeout(
                        () => {
                            focusPlayer();
                        },
                        30
                    );
                }
            };


        /*
         * SI LA VENTANA PIERDE FOCO
         */

        window.addEventListener(
            "blur",
            () => {

                pressedKeys.clear();

                updateKeyDebug();
            }
        );


        /*
         * ESTADO INICIAL
         */

        updateKeyDebug();

    </script>

</body>

</html>
