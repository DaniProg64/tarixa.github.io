<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Papa Louie - Tarixa</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <div id="game-container"></div>
    <div id="key-debug"></div>
    <script>
        const ruffle =
            window.RufflePlayer.newest();

        const player =
            ruffle.createPlayer();

        player.tabIndex = 0;

        document
            .getElementById("game-container")
            .appendChild(player);

        player.load(
            "games/papa-louie/papalouie_v2.swf"
        );

        player.addEventListener(
            "click",
            () => {
                player.focus();
            }
        );

        player.addEventListener(
            "touchstart",
            () => {
                player.focus();
            }
        );



        const pressedKeys = new Set();

const keyDebug =
    document.getElementById("key-debug");

function updateKeyDebug() {

    if (pressedKeys.size === 0) {

        keyDebug.innerHTML =
            "Teclas presionadas:<br>Ninguna";

        return;
    }

    keyDebug.innerHTML =
        "Teclas presionadas:<br>" +
        Array
            .from(pressedKeys)
            .join("<br>");
}

document.addEventListener(
    "keydown",
    event => {

        pressedKeys.add(
            event.code
        );

        updateKeyDebug();

        console.log(
            "KEY DOWN",
            event.code,
            event.key,
            event.keyCode
        );
    },
    true
);

document.addEventListener(
    "keyup",
    event => {

        pressedKeys.delete(
            event.code
        );

        updateKeyDebug();

        console.log(
            "KEY UP",
            event.code,
            event.key,
            event.keyCode
        );
    },
    true
);

window.addEventListener(
    "blur",
    () => {

        pressedKeys.clear();

        updateKeyDebug();

        console.log(
            "WINDOW BLUR - teclas limpiadas"
        );
    }
);

updateKeyDebug();
    </script>

    

</body>

</html>
