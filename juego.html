<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Tarixa Player</title>

    <link
        rel="stylesheet"
        href="styles/juego.css"
    >

</head>


<body>

    <!-- ==========================================
         TOP BAR
         ========================================== -->

    <header id="game-header">

        <a
            href="index.html"
            class="volver"
        >
            ← Tarixa
        </a>

        <span id="game-title">
            Tarixa Player
        </span>

        <button
            id="fullscreen-button"
            type="button"
            aria-label="Fullscreen"
            title="Fullscreen"
        >
            ⛶
        </button>

    </header>


    <!-- ==========================================
         GAME
         ========================================== -->

    <main id="game-container"></main>


    <script>

        /*
         * ==========================================
         * GAMES
         * ==========================================
         */

        const games = {

            "papa-louie": {

                title: "Papa Louie",

                swf: "games/papalouie_v2.swf",

                ruffle: "current"

            },


            "stick-war": {

                title: "Stick War",

                swf: "games/stickwargame.swf",

                ruffle: "2021-03-17"

            },

            "tj-trapomatic":{
                title: "Tom & Jerry",

                swf: "games/tj_trapomatic.swf",

                ruffle: "current"
            }

        };


        /*
         * ==========================================
         * GET GAME
         * ==========================================
         */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const gameId =
            params.get("game");


        const game =
            games[gameId];


        /*
         * ==========================================
         * GAME NOT FOUND
         * ==========================================
         */

        if (!game) {

            document.body.innerHTML = `

                <div class="game-error">

                    <h1>
                        Game not found
                    </h1>

                    <p>
                        This game doesn't exist
                        or is no longer available.
                    </p>

                    <a href="index.html">
                        Back to Tarixa
                    </a>

                </div>

            `;


            throw new Error(
                "Game not found: " + gameId
            );

        }


        /*
         * ==========================================
         * PAGE TITLE
         * ==========================================
         */

        document.title =
            game.title + " - Tarixa";


        document
            .getElementById("game-title")
            .textContent =
                game.title;


        /*
         * ==========================================
         * RUFFLE VERSION
         * ==========================================
         */

        function loadRuffle(version) {

            return new Promise(
                (resolve, reject) => {

                    const script =
                        document.createElement(
                            "script"
                        );


                    /*
                     * Stick War
                     * Ruffle compatible version
                     */

                    if (
                        version ===
                        "2021-03-17"
                    ) {

                        script.src =
                            "https://files.crazygames.com/gameframe/ruffle/2021-03-17/ruffle.js";

                    }


                    /*
                     * Current Ruffle
                     */

                    else {

                        script.src =
                            "https://unpkg.com/@ruffle-rs/ruffle";

                    }


                    script.onload =
                        () => resolve();


                    script.onerror =
                        () => reject(
                            new Error(
                                "Unable to load Ruffle"
                            )
                        );


                    document
                        .head
                        .appendChild(script);

                }
            );

        }


        /*
         * ==========================================
         * PLAYER
         * ==========================================
         */

        let player = null;


        async function startGame() {

            try {

                /*
                 * Load required Ruffle version
                 */

                await loadRuffle(
                    game.ruffle
                );


                /*
                 * Create Ruffle player
                 */

                const ruffle =
                    window
                        .RufflePlayer
                        .newest();


                player =
                    ruffle.createPlayer();


                player.tabIndex = 0;


                /*
                 * ==================================
                 * PLAYER SIZE
                 * ==================================
                 */
                if (gameId === "stick-war") {
                
                    player.style.width =
                        "100%";
                
                    player.style.height =
                        "auto";
                
                    player.style.aspectRatio =
                        "4 / 3";
                
                    player.style.maxWidth =
                        "calc((100dvh - 55px) * 4 / 3)";
                
                    player.style.maxHeight =
                        "calc(100dvh - 55px)";
                
                }
                else {
                
                    player.style.width =
                        "100%";
                
                    player.style.height =
                        "100%";
                
                }
                
                player.style.display =
                    "block";
                player.style.display =
                    "block";

             


                /*
                 * Add player
                 */

                document
                    .getElementById(
                        "game-container"
                    )
                    .appendChild(player);


                /*
                 * ==================================
                 * LEGACY RUFFLE
                 * Stick War
                 * ==================================
                 */

                if (
                    game.ruffle ===
                    "2021-03-17"
                ) {
                
                    player.config = {
                    
                        splashScreen:
                            false,
                    
                        contextMenu:
                            "off",
                    
                        autoplay:
                            true,
                    
                        warnOnUnsupportedContent:
                            false,
                    
                        allowScriptAccess:
                            true,
                    
                        maxExecutionDuration:
                            30
                    
                    };
                
                
                    player.load(
                        game.swf
                    );
                
                }

                /*
                 * ==================================
                 * CURRENT RUFFLE
                 * Papa Louie
                 * ==================================
                 */

                else {

                    player.load({

                        url:
                            game.swf,

                        autoplay:
                            "on",

                        unmuteOverlay:
                            "hidden",

                        letterbox:
                            "on",

                        scale:
                            "showAll",

                        forceScale:
                            true

                    });

                }


                /*
                 * ==================================
                 * PLAYER FOCUS
                 * ==================================
                 */

                player.addEventListener(
                    "pointerdown",
                    focusPlayer
                );

            }
            catch (error) {

                console.error(
                    "Unable to start game:",
                    error
                );


                document
                    .getElementById(
                        "game-container"
                    )
                    .innerHTML = `

                        <div class="game-error">

                            <h1>
                                Unable to start game
                            </h1>

                            <p>
                                The game player
                                could not be loaded.
                            </p>

                        </div>

                    `;

            }

        }


        /*
         * ==========================================
         * PLAYER FOCUS
         * ==========================================
         */

        function focusPlayer() {

            if (!player) {
                return;
            }


            try {

                player.focus();

            }
            catch (error) {

                console.log(
                    "Unable to focus Ruffle",
                    error
                );

            }

        }


        /*
         * ==========================================
         * FULLSCREEN
         * ==========================================
         */

        const fullscreenButton =
            document.getElementById(
                "fullscreen-button"
            );


        fullscreenButton.addEventListener(
            "click",
            async () => {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await document
                            .documentElement
                            .requestFullscreen();

                    }
                    else {

                        await document
                            .exitFullscreen();

                    }


                    focusPlayer();

                }
                catch (error) {

                    console.log(
                        "Fullscreen is not available",
                        error
                    );

                }

            }
        );


        /*
         * ==========================================
         * VIRTUAL KEYS
         * Future Android controls
         * ==========================================
         */

        const pressedKeys =
            new Set();


        window.tarixaKeyDown =
            function (key) {

                pressedKeys.add(
                    key
                );

            };


        window.tarixaKeyUp =
            function (key) {

                pressedKeys.delete(
                    key
                );


                if (
                    pressedKeys.size === 0
                ) {

                    try {

                        if (player) {

                            player.blur();

                        }

                    }
                    catch (error) {

                        console.log(
                            "Blur unavailable",
                            error
                        );

                    }


                    setTimeout(
                        focusPlayer,
                        30
                    );

                }

            };


        /*
         * ==========================================
         * WINDOW FOCUS
         * ==========================================
         */

        window.addEventListener(
            "blur",
            () => {

                pressedKeys.clear();

            }
        );


        /*
         * ==========================================
         * START
         * ==========================================
         */

        startGame();

    </script>

</body>

</html>
