<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Papa Louie - Tarixa</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <div id="game-container"></div>

    <script>
        const ruffle =
            window.RufflePlayer.newest();

        const player =
            ruffle.createPlayer();

        player.tabIndex = 0;

        document
            .getElementById("game-container")
            .appendChild(player);

        player.load(
            "games/papa-louie/papalouie_v2.swf"
        );

        player.addEventListener(
            "click",
            () => {
                player.focus();
            }
        );

        player.addEventListener(
            "touchstart",
            () => {
                player.focus();
            }
        );
    </script>

</body>

</html>
