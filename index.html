<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tarixa</title>

    <link
        rel="stylesheet"
        href="styles/styles.css"
    >
</head>


<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            <h2>Tarixa</h2>

            <span>
                Explore. Create. Share.
            </span>

        </div>

    </header>


    <main>

        <!-- HERO -->

        <section class="portada">

            <h1>
                Discover amazing projects
            </h1>

            <p>
                Games, apps and experiences
                created by the community.
            </p>

            <a
                href="#projects"
                class="boton"
            >
                Explore projects
            </a>

        </section>


        <!-- PROJECTS -->

        <section
            class="explorar"
            id="projects"
        >

            <h2>
                Explore
            </h2>


            <!-- CATEGORIES -->

            <div class="categorias">

                <button type="button">
                    All
                </button>

                <button type="button">
                    Games
                </button>

                <button type="button">
                    Flash
                </button>

                <button type="button">
                    Apps
                </button>

                <button type="button">
                    Experiments
                </button>

            </div>


            <!-- PROJECT GRID -->

            <div class="proyectos">


                <!-- PAPA LOUIE -->

                <article class="proyecto">

                    <div class="imagen">
                        <span>Flash</span>
                    </div>

                    <div class="info">

                        <h3>
                            Papa Louie
                        </h3>

                        <a href="juego.html?game=papa-louie">
                            Play
                        </a>

                    </div>

                </article>


                <!-- STICK WAR -->

                <article class="proyecto">

                    <div class="imagen">
                        <span>Flash</span>
                    </div>

                    <div class="info">

                        <h3>
                            Stick War
                        </h3>

                        <a href="juego.html?game=stick-war">
                            Play
                        </a>

                    </div>

                </article>


            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <strong>
            Tarixa
        </strong>

        <p>
            Explore. Create. Share.
        </p>

    </footer>

</body>

</html>
