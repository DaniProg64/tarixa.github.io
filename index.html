<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tarixa Project</title>

    <link
        rel="stylesheet"
        href="styles/styles.css"
    >
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            <h1>Tarixa Project</h1>

            <p>
                Explore. Create. Share.
            </p>
        </div>

    </header>


    <main>

        <!-- SEARCH -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="search"
                    id="search"
                    placeholder="Find projects..."
                    autocomplete="off"
                >

            </div>

        </section>


        <!-- SUPPORT -->

        <section class="support-section">
            <a
                href="#support"
                class="support-card"
            >
                    
                <div class="support-icon">
                    ♡
                </div>
            
                <div>
                    <strong>
                        Support Tarixa
                    </strong>
                
                    <span>
                        Help us keep Tarixa growing.
                    </span>
                </div>
            
            </a>

        </section>


        <!-- PROJECTS -->

        <section
            class="projects-section"
            id="projects"
        >

            <div class="section-header">

                <h2>
                    Explore
                </h2>

            </div>


            <!-- CATEGORIES -->

            <div class="categories">

                <button
                    class="category active"
                    type="button"
                >
                    All
                </button>

                <button
                    class="category"
                    type="button"
                >
                    Games
                </button>

                <button
                    class="category"
                    type="button"
                >
                    Flash
                </button>

                <button
                    class="category"
                    type="button"
                >
                    Apps
                </button>

            </div>


            <!-- PROJECT GRID -->

            <div class="projects-grid">


                <!-- PAPA LOUIE -->

                <article
                    class="project-card"
                    data-title="Papa Louie"
                >

                    <div class="project-image">

                        <span>
                            Flash
                        </span>

                    </div>


                    <div class="project-info">

                        <h3>
                            Papa Louie
                        </h3>

                        <p>
                            Game
                        </p>

                        <a
                            href="juego.html?game=papa-louie"
                            class="play-button"
                        >
                            Play
                        </a>

                    </div>

                </article>


                <!-- STICK WAR -->

                <article
                    class="project-card"
                    data-title="Stick War"
                >

                    <div class="project-image">

                        <span>
                            Flash
                        </span>

                    </div>


                    <div class="project-info">

                        <h3>
                            Stick War
                        </h3>

                        <p>
                            Game
                        </p>

                        <a
                            href="juego.html?game=stick-war"
                            class="play-button"
                        >
                            Play
                        </a>

                    </div>

                </article>

                
            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <strong>
            Tarixa Project
        </strong>

        <p>
            Explore. Create. Share.
        </p>

    </footer>


    <!-- SIMPLE SEARCH -->

    <script>

        const search =
            document.getElementById("search");

        const projects =
            document.querySelectorAll(
                ".project-card"
            );


        search.addEventListener(
            "input",
            () => {

                const value =
                    search.value
                        .toLowerCase()
                        .trim();


                projects.forEach(
                    project => {

                        const title =
                            project.dataset.title
                                .toLowerCase();


                        if (
                            title.includes(value)
                        ) {

                            project.style.display =
                                "";

                        }
                        else {

                            project.style.display =
                                "none";

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
